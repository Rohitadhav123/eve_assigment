version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eve_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eve_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eve_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eve_db?schema=public
      JWT_SECRET: super-secret-jwt-key-for-eve-healthcare-2026
      JWT_EXPIRES_IN: 24h
      PAYMENT_SUCCESS_RATE: 0.8
      WEBHOOK_SECRET: super-secret-webhook-key-12345
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && npm start"

volumes:
  pgdata:
